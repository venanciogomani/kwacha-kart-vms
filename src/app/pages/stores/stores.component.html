<div class="p-4 flex flex-col">
    <div class="flex flex-row px-4 items-center">
        <h1 class="text-gray-700 text-lg md:text-2xl font-black mb-2">
            Stores
        </h1>
        <button class="py-2 px-4 text-sm bg-emerald-700 text-white ml-2 rounded-lg inline-block md:hidden">
            Add Store
        </button>
        <select
            class="
                bg-white py-3 px-3 ml-2 rounded-lg md:hidden text-sm font-semibold
                text-gray-600 cursor-pointer focus:outline-none w-[200px]
            "
        >
            <option>Stores</option>
            <option>Team</option>
            <option>Roles & Permissions</option>
            <option>Notifications</option>
            <option>Plan</option>
        </select>
    </div>
    <div class="w-full p-4">
        <div class="bg-white py-2 px-3 w-full rounded-lg hidden md:flex flex-row text-sm font-semibold">
            <div class="py-2 px-5 text-gray-500 bg-gray-100 rounded-lg shadow-md">
                Stores
            </div>
            <div class="py-2 px-5 text-gray-500 mx-2 cursor-pointer rounded-lg bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                Team
            </div>
            <div class="py-2 px-5 text-gray-500 mx-2 cursor-pointer rounded-lg bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                Roles & Permissions
            </div>
            <div class="py-2 px-5 text-gray-500 mx-2 cursor-pointer rounded-lg bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                Notifications
            </div>
            <div class="py-2 px-5 text-gray-500 mx-2 cursor-pointer rounded-lg bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                Plan
            </div>
        </div>
    </div>
    <div class="w-full p-4 flex flex-col">
        <div class="py-2 px-3 bg-white rounded-lg">
            <div class="w-full flex flex-row items-center justify-between pt-4">
                <div class="flex flex-row items-center">
                    <input
                        type="text"
                        class="
                            py-3 px-3 rounded-lg text-sm
                            text-gray-600 focus:outline-none border-2 border-gray-200 mr-2
                            max-w-full md:max-w-[500px] min-w-[300px] md:min-w-[300px]
                        "
                        placeholder="Search for stores"
                    />
                    <button
                        class="
                            bg-emerald-600 py-3 px-3 rounded-lg text-sm
                            text-white focus:outline-none"
                    >
                        Search
                    </button>
                </div>
                <button
                    class="
                        bg-transparent py-3 px-4 text-sm border-2 border-gray-700
                        text-gray-700 hover:bg-gray-700 hover:border-gray-700 hover:text-white
                        transition duration-200 ease-in-out hidden md:flex
                    "
                >
                    Add Store
                </button>
            </div>
            <div class="flex flex-col py-2">
                <!-- desktop table -->
                <div class="relative overflow-x-auto shadow-md hidden md:block">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-white text-black dark:text-white border-b dark:bg-gray-700 dark:border-gray-700">
                            <tr>
                                <th scope="col" class="p-4">
                                    <div class="flex items-center">
                                        <input 
                                            type="checkbox"
                                            class="w-4 h-4
                                            text-gray-600
                                            bg-gray-100
                                            border-gray-300
                                            rounded
                                            focus:ring-gray-500
                                            dark:focus:ring-gray-600
                                            dark:ring-offset-gray-800
                                            dark:focus:ring-offset-gray-800
                                            focus:ring-2
                                            dark:bg-gray-700
                                            dark:border-gray-600"
                                        />
                                    </div>
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    NAME
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    VENDOR
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    WEIGHT
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    REVENUE
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    STATUS
                                </th>
                                <th scope="col" class="px-6 py-3">
                                    ACTIONS
                                </th>
                            </tr>
                        </thead>
                        <tbody class="text-gray-800">
                            <tr class="border-b">
                                <td class="w-4 p-4">
                                    <div class="flex items-center">
                                        <input 
                                            type="checkbox"
                                            class="w-4 h-4
                                            text-gray-600
                                            bg-gray-100
                                            border-gray-300
                                            rounded
                                            focus:ring-gray-500
                                            dark:focus:ring-gray-600
                                            dark:ring-offset-gray-800
                                            dark:focus:ring-offset-gray-800
                                            focus:ring-2
                                            dark:bg-gray-700
                                            dark:border-gray-600"
                                        />
                                    </div>
                                </td>
                                <th scope="row" class="px-6 py-4">
                                    Smart Business Center
                                </th>
                                <td class="px-6 py-4">
                                    <div class="flex flex-col">
                                        <span>
                                            Venancio Gomani
                                        </span>
                                        <span class="font-semibold">
                                            0977000000
                                        </span>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    8.0
                                </td>
                                <td class="px-6 py-4">
                                    ZK70,000
                                </td>
                                <td class="px-6 py-4 w-14">
                                    <mat-slide-toggle>
                                        Inactive
                                    </mat-slide-toggle>
                                </td>
                                <td class="px-6 py-4 relative">
                                    <mat-icon
                                        class="text-gray-600 cursor-pointer"
                                        fontIcon="more_horiz"
                                    ></mat-icon>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- mobile table -->
                <div class="flex flex-col md:hidden first:mt-0 mt-4">
                    <div class="flex flex-row items-center justify-between w-full p-3 bg-gray-100">
                        <span class="text-sm text-gray-600 font-semibold">
                            SMART BUSINESS CENTER
                        </span>
                        <mat-icon
                            class="text-gray-600 cursor-pointer"
                            fontIcon="arrow_drop_down"
                        ></mat-icon>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full border">
                        <span class="text-sm text-gray-600 font-semibold w-1/4 p-3">
                            VENDOR
                        </span>
                        <div class="w-3/4 flex flex-col p-3 border-l">
                            <span class="text-sm text-gray-600 pl-2">
                                Venancio Gomani
                            </span>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full border">
                        <span class="text-sm text-gray-600 font-semibold w-1/4 p-3">
                            WEIGHT
                        </span>
                        <div class="w-3/4 flex flex-col p-3 border-l">
                            <span class="text-sm text-gray-600 pl-2">
                                8.0
                            </span>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full border">
                        <span class="text-sm text-gray-600 font-semibold w-1/4 p-3">
                            REVENUE
                        </span>
                        <div class="w-3/4 flex flex-col p-3 border-l">
                            <span class="text-sm text-gray-600 pl-2">
                                ZK70,000
                            </span>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-between w-full border">
                        <span class="text-sm text-gray-600 font-semibold w-1/4 p-3">
                            STATUS
                        </span>
                        <div class="w-3/4 flex flex-col p-3 border-l">
                            <span class="text-sm text-gray-600 pl-2">
                                <mat-slide-toggle>
                                    Inactive
                                </mat-slide-toggle>
                            </span>
                        </div>
                    </div>
                    <div class="flex flex-row items-center justify-end w-full border p-3">
                        <button
                            class="
                                bg-transparent border-2 border-gray-700 py-2 px-3 text-sm ml-1 text-gray-700
                                transition duration-200 ease-in-out rounded-lg
                            "
                        >
                            <mat-icon
                                class="cursor-pointer"
                                fontIcon="edit"
                            ></mat-icon>
                        </button>
                        <button
                            class="
                                bg-gray-700 py-2 px-3 text-sm ml-1 text-white
                                transition duration-200 ease-in-out rounded-lg
                            "
                        >
                            <mat-icon
                                class="cursor-pointer"
                                fontIcon="delete"
                            ></mat-icon>
                        </button>
                    </div>
                </div>
                <!-- Pagination -->
                <div class="flex-row items-center justify-between my-4 flex">
                    <div>
                        <span class="text-sm text-gray-700">1 - 10 of 57</span>
                    </div>
                    <div class="flex flex-row border-2">
                        <span class="p-2 border-r-2 cursor-pointer bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                            First
                        </span>
                        <span class="p-2 border-r-2 cursor-pointer bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                            Prev
                        </span>
                        <span class="py-2 px-4 border-r-2 cursor-pointer bg-gray-700 text-white hover:bg-gray-100 transition duration-200 ease-in-out">
                            1
                        </span>
                        <span class="py-2 px-4 border-r-2 cursor-pointer bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                            2
                        </span>
                        <span class="p-2 border-r-2 cursor-pointer bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                            Last
                        </span>
                        <span class="p-2 cursor-pointer bg-transparent hover:bg-gray-100 transition duration-200 ease-in-out">
                            Last
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
